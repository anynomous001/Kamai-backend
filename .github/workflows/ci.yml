name: Kamai Backend CI

on:
  push:
    branches: [main, stage, development]
  pull_request:
    branches: [main, stage, development]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ── Lint & Type Check ────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

  # ── Tests ────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kamai
          POSTGRES_PASSWORD: kamai_test
          POSTGRES_DB: kamai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate
        env:
          DATABASE_URL: postgresql://kamai:kamai_test@localhost:5432/kamai_test

      - name: Run migrations
        run: pnpm run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://kamai:kamai_test@localhost:5432/kamai_test

      - name: Run tests
        run: pnpm run test:coverage
        env:
          DATABASE_URL: postgresql://kamai:kamai_test@localhost:5432/kamai_test
          REDIS_URL: redis://localhost:6379/1
          NODE_ENV: test
          JWT_SECRET: ci-jwt-secret-min-32-chars-long-!!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long-!
          COOKIE_SECRET: ci-cookie-secret-min-32-chars-long-!
          CORS_ORIGIN: http://localhost:3000

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ── Build ─────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Docker build check
        run: docker build --target builder -t kamai-backend-ci .
